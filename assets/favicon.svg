<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#101a33"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12"
        fill="none" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Small gold cross -->
  <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="18"/>
    <line x1="28" y1="14" x2="36" y2="14"/>
  </g>

  <!-- W -- white -->
  <text x="9" y="47"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="-1">W</text>

  <!-- W -- gold -->
  <text x="34" y="47"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-weight="900"
        fill="url(#gold)"
        letter-spacing="-1">W</text>
</svg>
