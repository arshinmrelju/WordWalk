<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f0d47a"/>
      <stop offset="50%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7a1a"/>
    </linearGradient>
    <linearGradient id="deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#152044"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" fill="url(#deep)" stroke="url(#ring)" stroke-width="4"/>

  <!-- Inner decorative ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(212,175,55,0.28)" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- Cross -->
  <g stroke="url(#ring)" stroke-width="7" stroke-linecap="round">
    <line x1="60" y1="30" x2="60" y2="58"/>
    <line x1="48" y1="44" x2="72" y2="44"/>
  </g>

  <!-- Open book / path base -->
  <path d="M30 66 Q60 76 90 66 L84 92 Q60 100 36 92 Z" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="60" y1="74" x2="60" y2="96" stroke="url(#ring)" stroke-width="3" stroke-linecap="round"/>
</svg>
